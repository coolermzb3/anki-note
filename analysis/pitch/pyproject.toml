[project]
name = "anki-note-pitch-comparison"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "librosa==0.11.0",
    "matplotlib==3.11.1",
    "numpy==2.4.6",
    "onnx>=1.22.0",
    "onnxscript>=0.7.1",
    "pesto-pitch==2.0.1",
    "scipy==1.18.0",
    "swift-f0==0.1.2",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchcrepe==0.0.24",
    "torchfcpe==0.0.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
